# Daemonkey · macOS 启动器云构建 (GitHub Actions) · 双架构
# ─────────────────────────────────────────────────────────────
# 为什么存在: BRO 没有 Mac · PyInstaller 不支持交叉编译 ·
#   Mac .app 必须在 macOS 上构建 → 用 GitHub Actions 免费 macOS runner。
# 触发: ① push tag v* (发版自动) ② workflow_dispatch (手动)
# 架构: 双矩阵并行 —
#   macos-14 = Apple Silicon (arm64 原生)
#   macos-15-intel = Intel (x86_64) · macos-13 已于 2025-12 退役
# 产物: dist/Daemonkey-<ver>-<arch>.dmg ×2 → Release 附件
# ─────────────────────────────────────────────────────────────
name: Build macOS Launcher

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'dmg 版本号（手动触发时必填，例如 1.0.2）'
        required: true
        type: string
  push:
    tags: ['v*']

jobs:
  build-mac:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller pywebview pyinstaller-hooks-contrib pystray Pillow

      - name: Build .app + dmg
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          case "$VER" in master|main|develop|"") echo "version empty"; exit 1 ;; esac
          echo "==> 打包版本: $VER · 架构: ${{ matrix.arch }}"
          bash tools/build_mac_app.sh "$VER"

      - name: Upload artifact (工作流产物)
        uses: actions/upload-artifact@v4
        with:
          name: Daemonkey-mac-${{ matrix.arch }}
          path: |
            dist/Daemonkey.app
            dist/Daemonkey-*.dmg
          if-no-files-found: error

      - name: Attach dmg to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: dist/Daemonkey-*.dmg
